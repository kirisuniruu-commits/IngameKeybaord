name: Build InGameKeyboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Preloader Android
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/preloader-android
          path: preloader-android

      - name: Set up Android NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build and package
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x ./build.sh
          ./build.sh "$GITHUB_WORKSPACE/preloader-android"

      - name: Upload LeviPack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InGameKeyboard-levipack
          path: dist/InGameKeyboard.levipack
          if-no-files-found: error
