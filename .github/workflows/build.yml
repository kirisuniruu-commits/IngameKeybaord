name: Build InGameKeyboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Preloader Android
        uses: actions/checkout@v4
        with:
          repository: LeviLamina/preloader-android
          path: preloader-android
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.1'

      - name: Run build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload LeviPack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InGameKeyboard-levipack
          path: "*.levipack"
          
